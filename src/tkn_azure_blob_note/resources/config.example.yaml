# Merge order: defaults, user, CWD, --config, CLI options.
# A sources mapping replaces the preceding layer's entire sources mapping.
schema_version: "2.0.0"
# Source IDs are custom labels, independent of account and container names.
# Rename my-obj-storage-1 to a name that identifies your container.
# Add another source at the same indentation level for another container.
sources:
  my-obj-storage-1:
    # null uses ~/.tkn/azure_blob_note/data/<source-id>
    data_root: null
    # null uses ~/.tkn/azure_blob_note/state/<source-id>
    state_root: null
    # null uses <data_root>/notes; or choose a directory inside your Vault.
    notes_root: null
    azure:
      account_url: null
      container: null
      prefix: ""
      auth: azure_cli
      managed_identity_client_id: null
      timeout_seconds: 60
    delivery:
      # Generates links only. Does not provision DNS/TLS or change access permissions.
      url_base: null
      cache_control: null
    conversion:
      enabled: true
      format: webp
      quality: 82
      lossless: false
      strip_metadata: true

  # Example of a second source: uncomment and set its account/container.
  # Multiple active sources require --source <source-id> for data commands.
  # Each account/container pair must be unique across sources.
  # my-obj-storage-2:
  #   data_root: null
  #   state_root: null
  #   notes_root: null
  #   azure:
  #     account_url: https://examplestorage.blob.core.windows.net
  #     container: another-container
  #   delivery:
  #     url_base: null
  #   conversion:
  #     enabled: true

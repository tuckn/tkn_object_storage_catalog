# Merge order: defaults, user, CWD, --config, CLI options.
# A sources mapping replaces the preceding layer's entire sources mapping.
schema_version: "3.2.0"
# Optional live-test targets; not ordinary sources. Never put credentials here.
# A mapping in a later config layer replaces all preceding integration_tests.
# See docs/testing/live-storage.md for the full Azure/R2/S3 setup.
integration_tests: {}
# Source IDs are custom labels, independent of account/container/bucket names.
# One source manages one Azure container, AWS S3 bucket, or Cloudflare R2 bucket.
sources:
  my-obj-storage-1:
    # null uses ~/.tkn/objstorage-imgcatalog/data/<source-id>
    data_root: null
    # null uses ~/.tkn/objstorage-imgcatalog/state/<source-id>
    state_root: null
    # null uses <data_root>/notes; or choose a directory inside your Vault.
    notes_root: null
    provider: azure # azure | s3 | r2
    azure:
      account_url: null
      container: null
      prefix: ""
      auth: azure_cli
      managed_identity_client_id: null
      timeout_seconds: 60
    # Used by both s3 and r2. Credentials come from the SDK environment/profile,
    # never from this file. R2 requires its S3 API endpoint and uses region auto.
    s3:
      bucket: null
      region: null
      endpoint_url: null
      prefix: ""
      profile: null
      timeout_seconds: 60
    delivery:
      # Generates links only. Does not provision DNS/TLS or change access permissions.
      url_base: null
      cache_control: null
    conversion:
      enabled: true
      format: webp
      quality: 82
      lossless: false
      strip_metadata: true

  # Example of an AWS S3 source: uncomment and set its bucket/region/profile.
  # Every data command requires --source <source-id>, even with one source.
  # Each container/bucket must be unique across sources, even with different prefixes.
  # my-obj-storage-2:
  #   data_root: null
  #   state_root: null
  #   notes_root: null
  #   provider: s3
  #   s3:
  #     bucket: example-images
  #     region: ap-northeast-1
  #     profile: default
  #   delivery:
  #     url_base: null
  #   conversion:
  #     enabled: true

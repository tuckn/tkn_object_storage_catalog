[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tkn-azure-blob-note"
version = "0.2.1"
description = "Preserve images, synchronize Azure blobs, and maintain Obsidian proxy notes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["azure-identity>=1.19,<2", "azure-storage-blob>=12.24,<13", "filelock>=3.16,<4", "Pillow>=11,<13", "ruamel.yaml>=0.18,<0.19"]

[project.scripts]
tkn-azure-blob-note = "tkn_azure_blob_note.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11", "mypy>=1.15"]

[tool.hatch.build.targets.wheel]
packages = ["src/tkn_azure_blob_note"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.md", "/CHANGELOG.md", "/pyproject.toml", "/uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
